name: ASP.NET Core CI/CD

on:
  push:
    branches: [ main ]  # Trigger the workflow on push to the main branch
  pull_request:
    branches: [ main ]  # Trigger the workflow on pull requests to the main branch

jobs:
  build:    # CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      #- name: Run unit tests
      #  run: dotnet test --no-build --verbosity normal

      #- name: Run StyleCop Analyzers
      #  run: dotnet build --configuration Release /p:EnableNETAnalyzers=true /p:AnalysisMode=All

      #- name: SonarQube Scan
      #  uses: sonarsource/sonarcloud-github-action@v2
      #  with:
      #    args: >
      #      -Dsonar.projectKey=KFRroomDAST
      #      -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
      #      -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  deploy:  # CD
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC Federated Credential
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Publish ApiService
        run: dotnet publish KFRoom.ApiService/KFRoom.ApiService.csproj -o ./publish/ApiService

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: KFroom-ApiService  # Replace with your Azure Web App name
          package: ./publish
